spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # Hikari defaults to 10 connections held open. The Supabase session pooler allows only a
      # handful per project, and during a Render deploy the old and new instance overlap, so 10
      # each can hit "max clients reached" at boot. Traffic here needs far fewer.
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
      max-lifetime: 600000
  h2:
    console:
      # Never in prod, whatever H2_CONSOLE_ENABLED says: the H2 console can run code on the server.
      enabled: false
  lifecycle:
    # Let in-flight requests (a scan, a webhook) finish when Render stops the old instance.
    timeout-per-shutdown-phase: 20s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: "${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}"
    baseline-version: 1
    clean-disabled: true
    locations: "classpath:db/migration,classpath:db/vendor/{vendor}"
server:
  shutdown: graceful
