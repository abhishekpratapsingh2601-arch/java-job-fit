name: Keep backend and database warm

# Supabase keeper: twice-daily DB ping that survives a Render cold start.
#
# Why this exists again as a schedule: the cron-job.org "supabase keep-awake" job cannot do
# this job on its own. Its request timeout is capped at 30s, a Render cold start takes ~60s,
# so whenever the separate keep-warm job dies (it auto-disables after ~26 consecutive
# failures — happened 5 Aug and again 22 Aug) every DB ping then hits a sleeping server, times
# out, and the DB job auto-disables too within a week (28 Aug). Supabase then pauses after 7
# idle days. This workflow has a 90s timeout and retries, so it wakes the server and still gets
# its answer. Twice a day is plenty for Supabase's 7-day idle rule, and GitHub cron's usual
# delay of minutes-to-an-hour is irrelevant at that cadence.
#
# The old "*/10 * * * *" keep-WARM schedule stays removed: GitHub cron is too delayed to
# stop Render's 15-minute sleep, and that is still cron-job.org's job (see KEEP_WARM_SETUP.md).
#
# Caveat: GitHub disables scheduled workflows in repos with no commits for 60 days. Any push
# re-arms it. If the project ever goes quiet that long, this needs a manual run or a commit.

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 and 15:00 UTC = 08:30 and 20:30 IST.
    - cron: "0 3,15 * * *"

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Ping /api/health/db with retries
        shell: bash
        run: |
          set -euo pipefail

          url="https://java-job-fit.onrender.com/api/health/db"
          response_file="/tmp/health.json"
          curl_error_file="/tmp/health-curl-error.log"
          max_attempts=5
          connect_timeout=15
          max_time=90

          echo "Checking JavaJobFit backend/database health"
          echo "Endpoint: ${url}"

          for attempt in $(seq 1 "${max_attempts}"); do
            echo ""
            echo "Attempt ${attempt}/${max_attempts}"

            rm -f "${response_file}" "${curl_error_file}"

            if http_status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout "${connect_timeout}" \
                --max-time "${max_time}" \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                "${url}" \
                2> "${curl_error_file}"
            )"; then
              echo "HTTP ${http_status}"

              if [ -f "${response_file}" ]; then
                echo "Response body:"
                cat "${response_file}"
                echo ""
              else
                echo "No response body file was created."
              fi

              if [ "${http_status}" = "200" ] && [ -f "${response_file}" ]; then
                if jq -e '.database == "reachable"' "${response_file}" > /dev/null; then
                  echo "Health check passed: HTTP 200 and database is reachable."
                  exit 0
                fi

                echo "JSON validation failed: expected database=reachable."
              elif [ "${http_status}" != "200" ]; then
                echo "Unexpected HTTP status: ${http_status}"
              fi
            else
              curl_exit=$?
              echo "curl failed with exit code ${curl_exit}."

              case "${curl_exit}" in
                6)
                  echo "Diagnostic: DNS resolution failed."
                  ;;
                7)
                  echo "Diagnostic: Connection refused or host unreachable."
                  ;;
                28)
                  echo "Diagnostic: Request timed out."
                  ;;
                35|60)
                  echo "Diagnostic: SSL/TLS certificate or handshake issue."
                  ;;
                *)
                  echo "Diagnostic: curl reported a network/client error."
                  ;;
              esac

              if [ -s "${curl_error_file}" ]; then
                echo "curl stderr:"
                cat "${curl_error_file}"
              fi
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_seconds=$((2 ** attempt))
              echo "Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo ""
          echo "Health check failed after ${max_attempts} attempts."
          exit 1
